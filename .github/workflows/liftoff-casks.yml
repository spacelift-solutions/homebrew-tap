name: Liftoff cask checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Liftoff casks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare changed casks with published releases
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFIER: ${{ github.event.pull_request.base.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=$(git diff --no-renames --name-only "$BASE" HEAD -- Casks/liftoff.rb Casks/liftoff-rc.rb)
          if [[ -z "$changed" ]]; then exit 0; fi
          mapfile -t casks <<< "$changed"
          git show "$VERIFIER:.github/scripts/verify-casks.py" > "$RUNNER_TEMP/verify-casks.py"
          gh api --paginate --slurp 'repos/spacelift-solutions/liftoff/releases?per_page=100' |
            python3 "$RUNNER_TEMP/verify-casks.py" "${casks[@]}"
